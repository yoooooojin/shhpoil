<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="ui.css">
<style>
  body { width: 300px; margin: 0; padding: 14px 14px 10px; }
  .top { display: flex; align-items: center; gap: 8px; }
  .top img { width: 28px; height: 28px; }
  .top h1 { font-size: 17px; margin: 0; flex: 1; }
  .tag { color: var(--sub); font-size: 12px; margin: 2px 0 12px; }
  .field { margin-bottom: 12px; }
  .opts label.switch { font-weight: 400; margin: 6px 0; }
  details { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 8px; }
  summary { cursor: pointer; font-weight: 600; font-size: 12px; color: var(--sub); }
  details[open] summary { margin-bottom: 4px; }
  #kwBox { display: none; }
  .foot { display: flex; justify-content: space-between; margin-top: 10px; }
</style>
</head>
<body>
  <div class="top">
    <img src="icons/icon48.png" alt="">
    <h1>쉿스포</h1>
    <label class="toggle" title="켜기 / 끄기"><input type="checkbox" id="enabled"><span></span></label>
  </div>
  <div class="tag">스포는 쉿, 수다는 그대로 · 내가 본 데까지만</div>


  <div class="field">
    <label for="show">보고 있는 작품</label>
    <input type="text" id="show" list="shows">
    <datalist id="shows"><option value="흑백요리사2"></option></datalist>
  </div>

  <div class="field">
    <label>어디까지 봤나요?</label>
    <div class="stepper">
      <button id="epMinus" aria-label="한 화 빼기">−</button>
      <div class="ep"><input type="number" id="watchedEpisode" min="0" max="99"><span>화까지 봤어요</span></div>
      <button id="epPlus" aria-label="한 화 더하기">＋</button>
    </div>
  </div>

  <div class="field">
    <label>얼마나 꼼꼼히 가릴까요?</label>
    <div class="seg presets">
      <button data-s="0.2">확실한 것만</button><button data-s="0.5">보통</button><button data-s="0.8">꼼꼼히</button>
    </div>
  </div>

  <div class="opts">
    <label class="switch"><span>지금 보는 영상도 확인 (재생 전 경고)</span><input type="checkbox" id="guardVideo"></label>
    <label class="switch"><span>키워드 방식과 비교 보기</span><input type="checkbox" id="compare"></label>
  </div>

  <details>
    <summary>고급 설정</summary>

    <label>민감도 세밀하게</label>
    <input type="range" id="sensitivity" min="0" max="1" step="0.05">
    <div class="row"><span>확실한 스포만</span><span>조금만 의심돼도</span></div>

    <label>판정 방식 (비교 시연용)</label>
    <div class="seg modes"><button data-mode="zoro">판정 모드</button><button data-mode="keyword">키워드 모드</button></div>
    <div id="kwBox">
      <label>차단 키워드 (쉼표로 구분)</label>
      <input type="text" id="keywords">
    </div>
    <div class="small" style="margin-top:4px">키워드 목록은 비교 보기의 기준으로도 쓰여요.</div>

    <label>판단 엔진 주소</label>
    <input type="text" id="serverUrl">
    <div class="small" id="health"></div>

    <label>엔진 속도 맞추기</label>
    <div style="display:flex; gap:8px">
      <div style="flex:1"><div class="small">한 번에 보낼 글 수</div><input type="number" id="batchSize" min="1" max="50"></div>
      <div style="flex:1"><div class="small">응답 대기 시간(초)</div><input type="number" id="timeoutSec" min="1" max="300"></div>
    </div>

    <label>YouTube API 키 (정확한 작성 시각용)</label>
    <input type="text" id="ytApiKey" placeholder="없으면 '10개월 전' 같은 표시로 추정">

    <label>학습된 기준 보정</label>
    <div class="small" id="offsets">아직 없음</div>
    <button class="link" id="resetLearning">학습 초기화</button>

    <label>잘못 판단한 글 모음</label>
    <div class="small" id="fbCount">아직 없음</div>
    <div class="small">"스포 아님 / 스포였음"을 누를 때마다 글과 그때의 판단이 쌓여요.</div>
    <button class="link" id="fbDownload">CSV 내려받기</button> · <button class="link" id="fbClear">비우기</button>
  </details>

  <details id="logBox">
    <summary>에이전트 실행 로그</summary>
    <label class="switch"><span>실행 로그 기록</span><input type="checkbox" id="logOn"></label>
    <label>시나리오 이름</label>
    <input type="text" id="logScenario" placeholder="예: 1_3화까지_판정">
    <div class="small" style="margin-top:4px">관찰 → 판단 → 라우팅 → 행동 → 학습이 시간순으로 쌓여요. 시나리오마다 <b>새로 시작</b>을 누르고, 끝나면 내려받으세요.</div>
    <div class="small" id="logCount" style="margin-top:6px">아직 없음</div>
    <label class="switch"><span>글 원문도 남기기 (GitHub에 올릴 땐 끄기)</span><input type="checkbox" id="logText"></label>
    <button class="link" id="logStart">새로 시작</button> ·
    <button class="link" id="logMd">Markdown</button> ·
    <button class="link" id="logJson">JSON</button> 내려받기
  </details>

  <div class="foot">
    <button class="link" id="openOnboarding">처음 안내 다시 보기</button>
    <span class="small" id="ver"></span>
  </div>
<script src="popup.js"></script>
</body>
</html>
