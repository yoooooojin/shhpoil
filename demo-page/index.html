<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>예능 잡담 - 시연용 커뮤니티</title>
<style>
  :root { --bg:#f4f4f2; --card:#fff; --line:#e3e3df; --ink:#222; --sub:#888; --accent:#3a5bd9; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  header { background:#2b2b2b; color:#fff; padding:12px 16px; font-weight:700; }
  header small { font-weight:400; color:#bbb; margin-left:8px; }
  main { max-width:760px; margin:16px auto; padding:0 16px; }
  .post { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; }
  .post h2 { font-size:18px; margin:0 0 4px; }
  .meta { color:var(--sub); font-size:13px; }
  .body { margin:12px 0; }
  .comments { border-top:1px solid var(--line); margin-top:12px; }
  .comment { padding:10px 0; border-bottom:1px solid var(--line); }
  .comment:last-child { border-bottom:0; }
  .comment .nick { font-weight:600; font-size:13px; margin-right:6px; }
  .comment time { color:var(--sub); font-size:12px; }
  .comment .text { margin-top:2px; }
  .note { font-size:12px; color:var(--sub); text-align:center; margin:24px 0; }
</style>
</head>
<body>
<header>예능 잡담 <small>시연용 가상 커뮤니티 · 모든 닉네임과 글은 예시입니다</small></header>
<main id="feed"></main>
<p class="note">이 페이지는 본데까지 확장 시연용입니다. 글은 data.js에서 바꿀 수 있어요.</p>

<script src="data.js"></script>
<script>
  // 확장이 읽는 구조: [data-bdk-comment] 요소 안의 .text(본문)와 time[datetime](게시 시각)
  const feed = document.getElementById("feed");
  const fmt = (iso) => {
    const d = new Date(iso);
    const p = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  };
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  for (const post of window.DEMO_POSTS) {
    const el = document.createElement("article");
    el.className = "post";
    el.innerHTML = `
      <h2 data-bdk-title>${esc(post.title)}</h2>
      <div class="meta">${esc(post.nick)} · <time datetime="${post.posted_at}">${fmt(post.posted_at)}</time></div>
      <div class="body" data-bdk-comment data-id="${post.id}">
        <div class="text">${esc(post.body)}</div>
        <time datetime="${post.posted_at}" hidden></time>
      </div>
      <div class="comments">
        ${post.comments.map(c => `
          <div class="comment" data-bdk-comment data-id="${c.id}">
            <span class="nick">${esc(c.nick)}</span><time datetime="${c.posted_at}">${fmt(c.posted_at)}</time>
            <div class="text">${esc(c.text)}</div>
          </div>`).join("")}
      </div>`;
    feed.appendChild(el);
  }
</script>
</body>
</html>
