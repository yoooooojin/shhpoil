<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  body { width: 280px; margin: 0; padding: 14px; font: 13px/1.5 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: #222; }
  h1 { font-size: 16px; margin: 0 0 2px; }
  .sub { color: #888; font-size: 12px; margin-bottom: 12px; }
  label { display: block; margin: 10px 0 4px; font-weight: 600; font-size: 12px; }
  input[type=text], input[type=number], select { width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
  input[type=range] { width: 100%; }
  .row { display: flex; justify-content: space-between; font-size: 11px; color: #888; }
  .seg { display: flex; border: 1px solid #ccc; border-radius: 6px; overflow: hidden; }
  .seg button { flex: 1; border: 0; background: #fff; padding: 6px; cursor: pointer; font: inherit; }
  .seg button.on { background: #222; color: #fff; }
  .switch { display: flex; align-items: center; justify-content: space-between; }
  .small { font-size: 11px; color: #888; }
  button.link { border: 0; background: none; color: #3a5bd9; cursor: pointer; padding: 0; font-size: 11px; }
  #kwBox { display: none; }
</style>
</head>
<body>
  <div class="switch"><h1>🤫 쉿스포</h1><input type="checkbox" id="enabled"></div>
  <div class="sub">스포는 쉿, 수다는 그대로 · 본 데까지만 보여줘요 · <span id="ver"></span></div>

  <label>작품</label>
  <input type="text" id="show">

  <label>어디까지 봤나요? (회차)</label>
  <input type="number" id="watchedEpisode" min="0" max="99">

  <label>민감도</label>
  <input type="range" id="sensitivity" min="0" max="1" step="0.05">
  <div class="row"><span>확실한 스포만</span><span>조금만 의심돼도</span></div>

  <label>판정 방식 (비교 시연용)</label>
  <div class="seg"><button data-mode="zoro">판정 모드</button><button data-mode="keyword">키워드 모드</button></div>

  <label class="switch" style="font-weight:400"><span>키워드 방식과 비교 보기</span><input type="checkbox" id="compare"></label>

  <div id="kwBox">
    <label>차단 키워드 (쉼표로 구분)</label>
    <input type="text" id="keywords">
  </div>

  <label>판단 엔진 주소</label>
  <input type="text" id="serverUrl">
  <div class="small" id="health"></div>

  <label>YouTube API 키 (댓글 정확한 작성 시각용)</label>
  <input type="text" id="ytApiKey" placeholder="없으면 '10개월 전' 같은 표시로 추정">

  <label>학습된 기준 보정</label>
  <div class="small" id="offsets">아직 없음</div>
  <button class="link" id="resetLearning">학습 초기화</button>

<script src="popup.js"></script>
</body>
</html>
